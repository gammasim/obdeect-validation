[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=75" ]

[project]
name = "obdeect-validation"
version = "0.1.0"
description = "Reproducible validation cases for obdeect simulation components"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [ "eventio", "numpy>=2.3" ]
optional-dependencies.dev = [ "pytest>=8", "towncrier>=24" ]
optional-dependencies.references = [ "astropy>=7", "eventio>=2", "matplotlib>=3.8", "numpy>=2", "scipy" ]
scripts.obdeect-validate = "obdeect_validation.cli:main"

[tool.setuptools]
packages.find.where = [ "src" ]
package-data.obdeect_validation = [ "adapters/*.txt" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra"

[tool.towncrier]
directory = "docs/changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = [ "", "", "" ]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "maintenance", name = "Maintenance", showcontent = true },
]
