---
name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/checkout@v4
        with:
          repository: gammasim/obdeect
          path: obdeect
          fetch-depth: 0  # setuptools-scm needs history
      - run: python -m pip install ./obdeect/src/stream
      - run: python -m pip install -e '.[dev,references]'
      - run: python -m pytest
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
